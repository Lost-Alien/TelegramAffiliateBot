version: '3.8'

services:
  affiliate-bot:
    build: .
    container_name: affiliate_telegram_bot
    restart: always
    env_file:
      - .env

  deal-poster:
    build: ./TelegramDealAutoPoster
    container_name: telegram_deal_poster
    restart: always
    env_file:
      - ./TelegramDealAutoPoster/.env
    ports:
      - "8000:8000"
    volumes:
      - ./TelegramDealAutoPoster:/app
