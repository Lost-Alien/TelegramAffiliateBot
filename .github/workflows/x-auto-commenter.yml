name: X Auto Commenter (TechSelect)

on:
  schedule:
    # 3x daily at peak Indian tech engagement windows (IST = UTC + 5:30)
    # 03:30 UTC = 09:00 AM IST (Morning commute)
    - cron: '30 3 * * *'
    # 08:30 UTC = 02:00 PM IST (Lunch peak)
    - cron: '30 8 * * *'
    # 13:30 UTC = 07:00 PM IST (Evening deals window)
    - cron: '30 13 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate without posting (dry run)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: x-auto-commenter
  cancel-in-progress: false

jobs:
  auto-comment:
    name: Run X Auto-Commenter
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute X Commenter Session
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_REPLIES_PER_RUN: '2'
          MAX_REPLIES_PER_DAY: '6'
        run: |
          python -m x_commenter.run
