name: X Auto Commenter (TechSelect)

on:
  schedule:
    # Run every hour at minute 0 (24x daily, 10 replies per hour)
    - cron: '0 * * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate without posting (dry run)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: x-auto-commenter
  cancel-in-progress: false

jobs:
  auto-comment:
    name: Run X Auto-Commenter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decode X Session Cookies
        if: ${{ env.TWITTER_COOKIES_B64 != '' }}
        env:
          TWITTER_COOKIES_B64: ${{ secrets.TWITTER_COOKIES_B64 }}
        run: |
          echo "$TWITTER_COOKIES_B64" | base64 -d > x_commenter/cookies.json
          chmod 600 x_commenter/cookies.json || true

      - name: Execute X Commenter Session
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          TWITTER_COOKIES_B64: ${{ secrets.TWITTER_COOKIES_B64 }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_REPLIES_PER_RUN: '10'
          MAX_REPLIES_PER_DAY: '240'
          MIN_DELAY_BETWEEN_REPLIES_SEC: '25'
        run: |
          python -m x_commenter.run

      - name: Clean up Ephemeral Cookie File
        if: always()
        run: |
          rm -f x_commenter/cookies.json cookies.json
